[project]
name = "spore-planner"
version = "0.1.0"
description = "Traffic-aware path planner for Spore AMRs: space-time routing against peer reservations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
spore-planner-sim = "spore_planner.sim:run"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
