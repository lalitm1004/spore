# Single source of truth for the track and the robot fleet.
# Regenerate with:  uv run python -m tools.make_track && uv run python -m tools.gen_fleet

track:
  plane_size: [4.0, 4.0]     # ground plane, metres (square keeps the texture power-of-two)
  track_size: [3.0, 2.0]     # the oval itself
  shape: oval
  line_width: 0.02
  pixels_per_metre: 512

robot:
  sensor_count: 3
  sensor_spacing: 0.02
  sensor_height: 0.015

defaults:
  sensors:
    # In ADC counts: the firmware sees 10-bit counts, not raw simulator units.
    white_ref: 1023
    black_ref: 205
    min_confidence: 0.15
    sample_period_s: 0.016
    latency_s: 0.0
    adc: {bits: 10, full_scale: 1000.0}
  control:
    base_speed: 6.0          # rad/s at the wheels (~0.12 m/s)
    max_speed: 20.0
    steering_limit: 8.0
    lost_line_timeout_s: 2.0
    # Error is in metres and steering is in rad/s, so kp is large by design.
    pid: {kp: 150.0, ki: 0.0, kd: 4.0}
  resources:
    memory: 256m
    cpus: "0.5"

robots:
  - name: bot_01
    pose: {x: 0.0, y: -1.0, theta: 0.0}
