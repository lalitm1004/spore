[project]
name = "network-layer"
version = "0.1.0"
description = "AMR fleet network layer: gRPC leader election, rosters, migration and job dispatch"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "grpcio>=1.83.1",
    "grpcio-tools>=1.83.1",
    "protobuf>=7.36.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # The container tier is almost entirely waiting: ~4.3 s per scenario, of
    # which the work is milliseconds and the rest is Docker starting a fleet.
    # Every fleet is already isolated -- its own network, its own container name
    # prefix -- so the scenarios parallelise without touching one another.
    "pytest-xdist>=3.6",
    # For the build lock below; xdist pulls it in already, but depending on it
    # by accident is not depending on it.
    "filelock>=3.13",
]

[tool.pytest.ini_options]
markers = [
    "docker: scenario tests on real containers and a real Docker network (skipped without a daemon)",
    "webots: the whole fleet in the real simulator, with real cameras reading real QR codes. Slow by nature and not on the container tier's five-minute budget, so it is opt-in: `-m webots`",
]
# Docker tests run last so the fast in-process tiers report first.
# The simulator tier is opt-in: it is minutes rather than seconds, and it needs
# images the container tier does not. `-m webots` runs it.
#
# `-n auto` because the container tier is almost entirely waiting -- 4.3 s per
# scenario, of which the work is milliseconds and the rest is Docker starting a
# fleet. Every fleet already has its own network and container-name prefix, so
# they do not touch. Measured on ten cores: 4:03 -> 51 s for the container tier,
# 17 s -> 7 s for the rest. It costs about 0.7 s of bootstrap, so `-n 0` is the
# tight loop when iterating on one file.
addopts = "-p no:cacheprovider -m 'not webots' -n auto"
