// The robot <-> network link.
//
// The authoritative contract for every payload is the shared JSON schema, not
// the fields of this envelope. There are two directions, each with its own
// schema, both defined in schemas/:
//
//   robot-to-network.schema.json   -- a robot reporting status upward
//   network-to-robot.schema.json   -- the network commanding a robot
//
// The envelope is deliberately opaque so the schemas can evolve without
// touching the transport, and so a network layer written in any language can
// validate the JSON against the same schema files. `schema` names the document
// a payload must validate against; `json` is that payload, serialised.

syntax = "proto3";

package spore.network.v1;

service RobotNetwork {
  // One long-lived bidirectional stream per robot. The robot (the companion,
  // acting for its robot) is the client; the network layer is the server.
  //
  // A stream is ordered and reliable, so no sequence numbers: a command and a
  // status can never be reordered, and the `timestamp` field inside each
  // payload is a data value, not a transport concern.
  rpc Session(stream Message) returns (stream Message);
}

message Message {
  // Which schema the `json` field validates against. One of:
  //   "robot-to-network"
  //   "network-to-robot"
  string schema = 1;

  // The payload, serialised as compact JSON.
  string json = 2;
}
