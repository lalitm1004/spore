# Single source of truth for the track and the robot fleet.
# Regenerate with:  uv run python -m tools.make_track && uv run python -m tools.gen_fleet

track:
  # A window of the real warehouse, not a generated lattice. The full
  # 120 x 70 m layout cannot be simulated at line-following resolution: one
  # texture would be 61440 x 35840 px against a GPU limit around 16384, and a
  # QR tile for each of its 881 nodes would want roughly 3.7 GB of texture
  # memory. This window keeps real node ids, names, types, regions and edges
  # -- 83 nodes of which 10 are charging bays.
  #
  # 32 x 16 m at 256 px/m is 8192 x 4096, both powers of two, so Webots does
  # not rescale it. The window is centred on the charging strip, which runs
  # along y = 800-1200 cm in the real layout.
  warehouse:
    source: ../../spore-warehouse-layout/output/warehouse.json
    # The whole warehouse: all 881 nodes, 952 lanes, 34 charging bays. The
    # window is the exact node span (x 400-11600, y 600-6400 cm) and the floor
    # extends `margin_m` beyond it.
    # A metre of slack around the node span (x 400-11600, y 600-6400 cm):
    # `load_window` drops a node sitting exactly on the boundary, which cost
    # 58 of the 881 when the window was the span exactly.
    origin_cm: [300, 500]
    size_m: [114, 60]
    # The floor texture is the warehouse *drawing* and nothing senses it: the
    # lanes are geometry, exact and free. So this sets how good the picture
    # looks, not how well a robot follows a line, and 64 px/m over the full
    # 128 x 64 m warehouse is one 8192x4096 texture rather than the 32768x16384
    # -- 2.1 GB -- that carrying the lanes in pixels would have cost.
    pixels_per_metre: 64
  line_width: 0.02

robot:
  sensor_count: 3
  sensor_spacing: 0.02
  sensor_height: 0.015
  # The deck, in metres. 500 x 500 is a real warehouse AMR rather than the
  # 120 x 90 breadboard this started as. It is only the *body*: the line is
  # 20 mm and the tiles are 100 mm, so the IR spacing and the camera footprint
  # stay matched to those and ride a boom ahead of the deck instead of scaling
  # with it. See the note at the top of protos/LineBot.proto.
  body_length: 0.50
  body_width: 0.50
  body_height: 0.10
  # Measured cost of the change, against the 120 x 90 chassis it replaced:
  # median fix error 4 -> 6 mm and median heading 0.2 -> 0.1 deg, which is a
  # wash, but worst-case heading went from 1.5 deg to 4 deg typical and has
  # been seen at 13.9 deg. The cause is inertia, not calibration -- the deck
  # has 22x the rotational inertia at the same mass, and TurnController stops
  # the wheels at the edge of a 4 deg band that a coasting body crosses in
  # 2.7 control steps. See tests/test_turn.py for what was tried.
  #
  # `body_height` is not free styling: the deck is centred so its underside
  # keeps 10 mm of clearance, and LineBot.proto derives that. An earlier
  # hardcoded centre buried a 100 mm deck 25 mm into the floor -- the robots
  # sat on their bellies, wheels spinning, odometry cheerfully reporting 65 m
  # while ground truth had them 0.000 m from the start line.

# Floor markers. Each is its own textured plane, not pixels in the track
# texture: at 512 px/m a QR module would be a single texel and Webots would
# mipmap the finder patterns away.
#
# `at` is normalised arclength along the centerline, so markers sit on the
# line and move with the track. The QR payload carries absolute position, so
# the fleet's graph is emergent -- no robot is ever handed a map.
markers:
  # Nodes come from the graph; only the tile's geometry is set here.
  spec:
    tile_mm: 100.0        # 92.7 mm of this is inside the camera's footprint
    qr_mm: 60.0           # 49 modules -> 6.8 camera px per module at 512 px
    margin_mm: 5.0
    # 5.12, not 10.24. The camera resolves 512 px over a 92.7 mm footprint --
    # 5.52 px/mm -- so a tile drawn at 10.24 px/mm carries roughly twice the
    # detail the optics can ever sample, and 881 of those is 3.7 GB against a
    # machine with 5 GB free. Measured through the camera's own crop-and-
    # resample on 81 real node payloads: 1024 px decoded 80/81, 768 px 81/81,
    # 512 px 81/81, 384 px 79/81. So this is a 4x saving that costs nothing,
    # and the floor is somewhere between 384 and 512 rather than below it.
    # Re-measure with tests/test_marker.py::test_survives_the_camera_resolution
    # after any change to the camera or the payload.
    pixels_per_mm: 5.12   # 100 mm -> exactly 512 px, a power of two
    border_rgb: [255, 122, 0]

defaults:
  sensors:
    # In ADC counts: the firmware sees 10-bit counts, not raw simulator units.
    white_ref: 1023
    black_ref: 205
    min_confidence: 0.15
    sample_period_s: 0.016
    latency_s: 0.0
    adc: {bits: 10, full_scale: 1000.0}
  control:
    # Unladen cruise. 18 rad/s on 20 mm wheels is 0.36 m/s -- 3x what this
    # ran at for most of its life, and the reason to care is wall clock: a job
    # that takes a third of the simulated seconds takes a third of the ticks,
    # and ticks are the only thing the simulator actually spends.
    #
    # The ceiling is the QR read, not the motors. The code sits inside the
    # camera's footprint for 42 mm of travel, so at 62.5 Hz:
    #
    #     6 rad/s   1.92 mm/tick   21.9 frames over the code
    #    18 rad/s   5.76 mm/tick    7.3 frames over the code
    #    20 rad/s   6.40 mm/tick    6.6 frames over the code
    #
    # and the colour trigger has to catch a 20 mm orange band on the way in,
    # which is 3.5 ticks at 18. Both still have margin; neither does at 20+.
    #
    # But the QR read is not what set this number. 18 was tried and measured:
    # the robots that kept the line covered 61 m where 6 rad/s managed 14, and
    # two of eight lost it immediately after a turn and halted. Coming out of a
    # turn the robot carries a few degrees of heading error -- the 500 mm deck
    # coasts through the turn controller's 2 deg band -- and lateral drift is
    # v*sin(e) against 10 mm of line:
    #
    #     6 rad/s   8.4 mm/s   1.19 s before the array is off the line
    #    12 rad/s  16.7 mm/s   0.60 s
    #    18 rad/s  25.1 mm/s   0.40 s
    #
    # The PID does not get a third of the time to correct and still win. 12 is
    # the speed that keeps a margin after a turn; getting back to 18 means
    # ramping up *after* a turn rather than resuming at cruise, which is a
    # change to the firmware and not to this number.
    base_speed: 12.0         # rad/s at the wheels (~0.24 m/s), unladen
    # Loaded, back to the speed the line follower was tuned at. Inert today:
    # the network layer never sends `set_mission`, so nothing ever tells a
    # robot it is carrying anything and every robot runs unladen.
    laden_speed: 6.0
    max_speed: 20.0
    steering_limit: 8.0
    lost_line_timeout_s: 2.0
    # The robot's patience at a junction: how long it waits to be told where
    # to go before driving on. THE one definition. gen_fleet writes it into the
    # firmware config and into the bot's ROBOT_PATIENCE, so the network layer's
    # "every hold stays under the robot's patience" invariant guards the number
    # the robot really uses. Three copies of this once disagreed (5.0/6.0/5.0).
    junction_timeout_s: 6.0
    # Error is in metres and steering is in rad/s, so kp is large by design.
    #
    # Left at 150 through the move to a 500 mm deck, having measured that
    # scaling it with the boom is wrong. The reasoning that failed: the PID
    # steers on lateral offset at the IR array, offset for heading error theta
    # is about L*theta, so moving the array 70 -> 270 mm looks like a 3.86x
    # gain increase and kp "should" drop to 38.9. Measured, that is much worse
    # -- median fix error 6 mm -> 43 mm, median heading 0.2 -> 8.2 deg. The
    # longer arm gives the loop lead, not just gain: the array sees a deviation
    # earlier, which the derivative term uses. Cutting kp only made it slow.
    pid: {kp: 150.0, ki: 0.0, kd: 4.0}
  resources:
    memory: 256m
    # The simulator is synchronized: every tick waits on the slowest
    # controller, so a throttled robot throttles the whole world. A controller
    # idles around 1% of a core but spikes to ~30% while OpenCV decodes a QR,
    # and a 0.5 cap is close enough to that spike to be worth avoiding. This
    # is headroom against a stall, not a speed multiplier -- measured, the
    # bottleneck is the simulator process (270-460% CPU) and not the robots.
    cpus: "1.0"

# Robots start at charging bays, which is where a fleet would be at the start
# of a shift. Poses come from the track itself, so changing the window cannot
# leave stale coordinates behind.
robots:
  count: 8
  spawn: charging
  # Released one at a time rather than all on tick zero. Bays are degree-1
  # spurs pairing onto a shared junction, and a simultaneous start puts both
  # bay-mates into that junction together. Spawns are ordered so a pair is
  # five slots apart -- 20 s here, against the 16.7 s a robot needs to cover
  # its 2 m spur at cruise -- so the pair never meets.
  #
  # The last robot leaves at 36 s. MISSION_DURATION runs from t=0 for every
  # robot, so allow for that when setting it: at the 120 s default bot_10 gets
  # 84 s of driving.
  start_interval_s: 4.0

# Obstacles for the forward-lidar reflex. Unlike marker tiles these carry a
# boundingObject, so a ray has something to hit.
#
# Placed 1.24 m into the lap -- far enough that the robot is tracking the line
# properly before it meets one. At spawn it would trip on the first tick, which
# is correct behaviour and a useless demonstration of it.
# No static obstacles: with ten robots on the grid they are each other's
# obstacles, which is the case worth watching.
obstacles: []
