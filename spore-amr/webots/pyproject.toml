[project]
name = "sih2026-linebot"
version = "0.1.0"
description = "Containerized line-following robot fleet for Webots"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=5.0.0.93",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "segno>=1.6.6",
    "svglib>=2.2.0",
    # The network layer, as a path dependency rather than a copy: the wire
    # contract is shared and a copied client is a client that drifts.
    "temp-network-interface",
]

[tool.uv.sources]
temp-network-interface = { path = "../temp-network-robot-glue-code-fix-this-pls-ojasw" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
