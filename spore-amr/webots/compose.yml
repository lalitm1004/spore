# The simulator. Robot brains live in compose.fleet.yml, generated from
# fleet.yaml, so that world and container robot names cannot drift apart.
#
#   docker compose -f compose.yml -f compose.fleet.yml up
#   then open http://localhost:1234/index.html
services:

  sim:
    image: sih2026/sim:dev
    # The host has a GPU and the container was not being given it, so Webots
    # fell back to software GL through Xvfb -- which cannot load this world at
    # all with rendering on: 83 marker tiles at 1024x1024 plus an 8192x4096
    # floor is 482 MB of texture. Handing over the render node is what makes
    # `./fleet.sh view` (server-side mjpeg) possible without shrinking any
    # texture, and so without touching the optics budget.
    #
    # Only the render nodes, not the card nodes: rendering needs no mode
    # setting, and renderD* is world-accessible where card* is not.
    devices:
      - /dev/dri:/dev/dri
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
    ports:
      - "1234:1234"
    volumes:
      - ./:/project
    working_dir: /project
    init: true
    user: "${DOCKER_USER:-1000:1000}"
    environment:
      WORLD: "${WORLD:-worlds/track.wbt}"
      MODE: "${MODE:-realtime}"
      RENDERING: "${RENDERING:-on}"
      STREAM_MODE: "${STREAM_MODE:-w3d}"
