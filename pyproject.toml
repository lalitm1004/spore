[project]
name = "sih2026-linebot"
version = "0.1.0"
description = "Containerized line-following robot fleet for Webots"
requires-python = ">=3.10"
dependencies = [
    "pillow>=11.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
